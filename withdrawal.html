<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Vault - Withdrawal</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #0b1220;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      background: #151f32;
      padding: 25px;
      border-radius: 16px;
    }

    h2 {
      text-align: center;
      color: #16d39a;
    }

    .balance-box {
      background: #0b1220;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 22px;
    }

    .balance-box small {
      color: #aab5c8;
    }

    .balance {
      display: block;
      color: #16d39a;
      font-size: 23px;
      font-weight: bold;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #34435c;
      border-radius: 8px;
      background: #0b1220;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #16d39a;
      color: #07150f;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #263751;
      color: white;
    }

    .max-btn {
      margin-top: 8px;
      padding: 9px;
      background: #263751;
      color: white;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #0b1220;
      color: #aab5c8;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      display: none;
    }

    .note {
      color: #aab5c8;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 18px;
    }

    a {
      color: #16d39a;
      text-decoration: none;
    }
  </style></head><body>  <div class="container"><h2>Crypto Vault Withdrawal</h2>

<div class="balance-box">
  <small>Available CVC Balance</small>
  <span class="balance" id="balance">Loading...</span>
</div>

<label for="walletNetwork">Wallet Network</label>
<select id="walletNetwork">
  <option value="">Select network</option>
  <option value="BNB Smart Chain">BNB Smart Chain</option>
  <option value="Ethereum Mainnet">Ethereum Mainnet</option>
</select>

<label for="walletAddress">Wallet Address</label>
<input
  type="text"
  id="walletAddress"
  placeholder="Enter your 0x wallet address"
  autocomplete="off"
>

<button type="button" id="saveWalletBtn" class="secondary">
  Save Wallet Details
</button>

<label for="withdrawalAmount">Withdrawal Amount (CVC)</label>
<input
  type="number"
  id="withdrawalAmount"
  placeholder="Enter amount"
  min="0"
  step="any"
>

<button type="button" id="maxBtn" class="max-btn">
  MAX
</button>

<button type="button" id="withdrawBtn">
  Submit Withdrawal Request
</button>

<div id="message"></div>

<p class="note">
  Withdrawal requests are saved for review. Saving a request does not
  automatically transfer cryptocurrency to your wallet.
</p>

<p style="text-align:center;margin-top:20px;">
  <a href="crypto.html">← Back to Crypto Vault</a>
</p>

  </div>  <script type="module" src="./withdrawal.js"></script></body>
</html>
