<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Vault Withdrawal</title><style>
* { box-sizing: border-box; }

body {
  background: #07111f;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: #122238;
  padding: 25px;
  border-radius: 18px;
}

h2 { color: #00e5a0; }

label {
  display: block;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  border: none;
  background: #20364e;
  color: white;
  outline: none;
}

.wallet-box {
  background: #20364e;
  padding: 14px;
  border-radius: 9px;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.wallet-box strong {
  color: #00e5a0;
}

.balance-box {
  background: #20364e;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.balance-box strong {
  color: #00e5a0;
  font-size: 20px;
}

.amount-row {
  display: flex;
  gap: 10px;
}

.amount-row input {
  flex: 1;
  min-width: 0;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  margin-top: 20px;
  background: #00d99a;
  font-weight: bold;
  cursor: pointer;
}

.max-btn {
  width: 75px;
  margin-top: 0;
  background: #176b58;
  color: white;
}

.back {
  background: #263b54;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

.note {
  color: #aab9ca;
  line-height: 1.5;
  font-size: 13px;
  margin-top: 15px;
}

#message {
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.5;
}

.success { color: #00e5a0; }
.error { color: #ff7777; }
</style></head><body><div class="container"><h2>Withdraw to Wallet</h2><div class="balance-box">
  <p>Available CVC Balance</p>
  <strong id="balance">Loading...</strong>
</div><label>Saved Wallet Address</label>

<div class="wallet-box" id="walletAddress">
  Loading...
</div><label>Wallet Network</label>

<div class="wallet-box">
  <strong id="walletNetwork">Loading...</strong>
</div><label>Withdrawal Amount (CVC)</label>

<div class="amount-row">
  <input
    type="number"
    id="amount"
    placeholder="Enter CVC amount"
    min="0"
    step="any"
  >  <button type="button" class="max-btn" id="maxBtn">
    MAX
  </button>
</div><button id="submitBtn">
  SUBMIT WITHDRAWAL REQUEST
</button><p class="note">
  Your request will be saved for review. Submitting a request does not automatically transfer cryptocurrency.
</p><button class="back" onclick="location.href='crypto.html'">
  BACK TO DASHBOARD
</button><p id="message"></p></div><script type="module">

import {
  Client,
  Account,
  Databases
} from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";

const client = new Client()
  .setEndpoint("https://nyc.cloud.appwrite.io/v1")
  .setProject("69d1aaac0005506756e0");

const account = new Account(client);
const databases = new Databases(client);

const DATABASE_ID = "69d1aaf5000f43c786be";
const USERS_COLLECTION_ID = "6af03bb90002e65a0035";

// ADD YOUR NEW SUCCESS PAGE URL HERE LATER
const SUCCESS_URL = "";

let currentUser;
let availableBalance = 0;

const balanceElement = document.getElementById("balance");
const amountInput = document.getElementById("amount");
const submitBtn = document.getElementById("submitBtn");
const maxBtn = document.getElementById("maxBtn");
const message = document.getElementById("message");

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = type;
}

function formatCVC(value) {
  return Number(value || 0).toFixed(12);
}

// LOAD USER AND WALLET DETAILS
async function loadData() {
  try {
    currentUser = await account.get();

    const profile = await databases.getDocument(
      DATABASE_ID,
      USERS_COLLECTION_ID,
      currentUser.$id
    );

    availableBalance = Number(profile.coinBalance || 0);

    balanceElement.textContent =
      formatCVC(availableBalance) + " CVC";

    document.getElementById("walletAddress").textContent =
      profile.walletAddress || "No wallet address saved";

    document.getElementById("walletNetwork").textContent =
      profile.walletNetwork || "No network saved";

    if (!profile.walletAddress || !profile.walletNetwork) {
      submitBtn.disabled = true;
      showMessage("Your wallet address or network is missing from your profile.");
      return;
    }

    if (availableBalance <= 0) {
      showMessage("You currently have no available balance.");
    }

  } catch (error) {
    console.error(error);
    balanceElement.textContent = "Unavailable";
    submitBtn.disabled = true;
    showMessage("Unable to load account: " + error.message);
  }
}

// MAX BUTTON
maxBtn.addEventListener("click", () => {
  if (availableBalance <= 0) {
    showMessage("Your balance is zero.");
    return;
  }

  amountInput.value = availableBalance.toFixed(12);
  showMessage("Maximum balance selected.", "success");
});

// SAVE WITHDRAWAL REQUEST
submitBtn.addEventListener("click", async () => {

  const amount = Number(amountInput.value);

  if (!currentUser) {
    showMessage("Please log in again.");
    return;
  }

  if (!Number.isFinite(amount) || amount <= 0) {
    showMessage("Enter a valid withdrawal amount.");
    return;
  }

  if (amount > availableBalance) {
    showMessage("Insufficient balance.");
    return;
  }

  const confirmed = confirm(
    "Confirm withdrawal request?\n\n" +
    "Amount: " + formatCVC(amount) + " CVC\n\n" +
    "Your saved wallet address and network will be used."
  );

  if (!confirmed) return;

  submitBtn.disabled = true;
  submitBtn.textContent = "SAVING...";

  try {

    await databases.updateDocument(
      DATABASE_ID,
      USERS_COLLECTION_ID,
      currentUser.$id,
      {
        withdrawalAmount: amount,
        withdrawalStatus: "Pending",
        withdrawalRequestedAt: new Date().toISOString()
      }
    );

    showMessage(
      "Withdrawal request saved successfully!",
      "success"
    );

    if (SUCCESS_URL.trim()) {
      setTimeout(() => {
        window.location.href = SUCCESS_URL;
      }, 1000);
    } else {
      submitBtn.textContent = "REQUEST SAVED";
    }

  } catch (error) {

    console.error(error);

    showMessage(
      "Failed to save withdrawal request: " + error.message
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "SUBMIT WITHDRAWAL REQUEST";
  }

});

loadData();

</script></body>
</html>
